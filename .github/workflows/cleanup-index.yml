name: Cleanup index

run-name: Rebuild the cleanup index

# Upstream already publishes GitHub Pages from the melee-docs derivation in
# build.yml, so this workflow stays out of the way there and only runs on forks.

on:
  push:
    paths:
      - 'src/**'
      - 'tools/cleanup_index.py'
      - 'tools/cleanup-index-template.html'
      - '.github/workflows/cleanup-index.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    name: Scan the tree
    runs-on: ubuntu-latest
    if: github.repository != 'doldecomp/melee'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build the index
        run: |
          python3 tools/cleanup_index.py \
            --out build/cleanup-index \
            --revision "${{github.sha}}" \
            --generated "$(date -u +'%Y-%m-%d')" \
            --repo "${{github.server_url}}/${{github.repository}}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/cleanup-index

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Remove the second clause once this is merged to the default branch.
    if: >-
      github.ref_name == github.event.repository.default_branch ||
      github.ref_name == 'ptr-cast-index'
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
